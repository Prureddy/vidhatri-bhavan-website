# Publishes the website to GitHub Pages on every push to main.
# Only the site's own files are published; notes such as PLAN.md and README.md stay private to the repository.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect the site files
        run: |
          mkdir -p _site/assets/images
          cp index.html 404.html _site/
          cp -r css js _site/
          cp assets/*.svg assets/*.png _site/assets/
          cp assets/images/*.jpg _site/assets/images/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
