<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Vidhatri Bhavan</title>
  <meta name="robots" content="noindex">
  <!-- Styles are inline because this page can be served from any address, where relative links to css/ would break. -->
  <style>
    body {
      margin: 0; min-height: 100vh;
      display: grid; place-items: center;
      padding: 24px; box-sizing: border-box;
      background: linear-gradient(180deg, #3E2415, #24140A);
      color: #FBF5EA;
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    h1 { font-family: Georgia, serif; font-size: clamp(2rem, 8vw, 3.2rem); margin: 0 0 6px; }
    p { margin: 0 0 24px; color: #F3E8D3; }
    a {
      display: inline-block; padding: 12px 24px; border-radius: 999px;
      background: #2F7D32; color: #fff; font-weight: 700; text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>ವಿಧಾತ್ರಿ ಭವನ</h1>
    <p>Sorry, this page isn't on our menu.</p>
    <a id="home" href="/">Back to Vidhatri Bhavan</a>
  </main>
  <script>
    // On a GitHub Pages project site the home page lives under /<repository>/, not at the domain root.
    if (location.hostname.endsWith("github.io")) {
      document.getElementById("home").href = "/" + location.pathname.split("/")[1] + "/";
    }
  </script>
</body>
</html>
